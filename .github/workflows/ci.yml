name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

concurrency:
  group: quickfix-ci-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    env:
      FRAPPE_REDIS_QUEUE: redis://127.0.0.1:6379
      FRAPPE_REDIS_CACHE: redis://127.0.0.1:6379
      FRAPPE_REDIS_SOCKETIO: redis://127.0.0.1:6379

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            quickfix/setup.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install frappe-bench
        run: |
          pip install frappe-bench

      - name: Initialize Bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-16" ~/frappe-bench

      - name: Get App
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app quickfix $GITHUB_WORKSPACE

      - name: Setup Requirements
        working-directory: /home/runner/frappe-bench
        run: |
          bench setup requirements --dev

      - name: Create Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site test_site --db-root-password root --admin-password admin

      - name: Install App
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site install-app quickfix

      - name: Build Assets
        working-directory: /home/runner/frappe-bench
        continue-on-error: true
        run: |
          bench build

      - name: Enable Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --app quickfix
        env:
          TYPE: server
