name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      FRAPPE_REDIS_QUEUE: redis://127.0.0.1:6379
      FRAPPE_REDIS_CACHE: redis://127.0.0.1:6379
      FRAPPE_REDIS_SOCKETIO: redis://127.0.0.1:6379
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install frappe-bench
        run: pipx install frappe-bench
      - name: Initialize bench
        run: bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16
      - name: Setup bench requirements
        run: bench setup requirements --dev
      - name: Create test site
        run: bench new-site test_site --db-root-password root --admin-password admin
      - name: Get app
        run: bench get-app quickfix $GITHUB_WORKSPACE
      - name: Install app
        run: bench --site test_site install-app quickfix
      - name: Enable tests
        run: bench --site test_site set-config allow_tests true
      - name: Run tests
        run: bench --site test_site run-tests --app quickfix --skip-test-records
