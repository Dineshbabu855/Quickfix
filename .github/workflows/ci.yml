name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python tools
        run: |
          pip install --upgrade pip
          pip install ruff black frappe-bench
      - name: Run ruff
        run: ruff check .
      - name: Run black
        run: black --check .
      - name: Bench init
        run: |
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch "version-16" ~/frappe-bench
      - name: Bench setup requirements
        working-directory: /home/runner/frappe-bench
        run: bench setup requirements --dev
      - name: Bench new site
        working-directory: /home/runner/frappe-bench
        run: bench new-site test.localhost --db-root-password root --admin-password admin
      - name: Bench install app
        working-directory: /home/runner/frappe-bench
        run: bench --site test.localhost install-app quickfix
      - name: Bench allow tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test.localhost set-config allow_tests true
      - name: Bench run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test.localhost run-tests --app quickfix --skip-test-records
